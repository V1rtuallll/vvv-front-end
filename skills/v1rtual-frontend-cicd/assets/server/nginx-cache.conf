# v1rtual.top 的静态缓存策略 —— 2026-09-21 已应用到生产。
#
# 这份文件不参与 CI 部署（deploy.yml 只上传 dist/），它记录的是 aaPanel 里
# /www/server/panel/vhost/nginx/47.108.211.14.conf 应该有的缓存行为。
# 改服务器前先看这里，改完把结果同步回这里。
#
# 改前的备份在服务器上：/root/vhost-v1rtual.bak-20260921-095819
# （另有一份更早的 47.108.211.14.conf.pre-cicd-20260804，是上一次大改留下的）
#
# ── 症状 ────────────────────────────────────────────────────────────────
# 发布之后浏览器仍然加载旧页面，强刷才生效。
#
# ── 原因 ────────────────────────────────────────────────────────────────
# index.html 的完整路径是 .../current/index.html —— 路径固定、文件名不含内容哈希。
# 原配置在 location / 上写了 `expires 7d`，把 HTML 外壳也缓存了一周：浏览器一直拿
# 旧 HTML，而旧 HTML 引用的是旧哈希的 chunk，新版本因此永远不出现。
# 同一份 vhost 里还有一条按扩展名的 `expires 180d`，它会命中 /jpgs/、/stickers/ 下
# 同样不带哈希的文件 —— 改图不换名就半年不更新（DefaultLayout.css 里那个手工的
# `?v=1` 就是这么来的）。
#
# ── 三档策略 ────────────────────────────────────────────────────────────
# 1. HTML 外壳（含所有 SPA 路由）→ no-cache，每次回源校验。这一条解决绝大部分问题。
# 2. /assets/ → 1 年。Vite 产物文件名带内容哈希，内容变了名字就变，可以放心长缓存。
# 3. public/ 下的 /jpgs/ /stickers/ /icons/ → 1 小时；/music/ → 7 天。
#    这些文件名不带哈希，改名才会变，只能用短缓存。
#
# ⚠️ 两处实现细节，换服务器或重装面板时必须保留：
#
# a) 用 `expires`，不要用 `add_header Cache-Control`。
#    nginx 的 add_header **不继承**：任何 location 里只要出现一条 add_header，
#    该层级就会丢掉 server 级的 Strict-Transport-Security 与 Alt-Svc。
#    `expires -1` 生成的正是 `Cache-Control: no-cache`，不需要 add_header。
#
# b) /assets/ 与 public/ 各目录必须用 `^~` 前缀匹配。
#    前缀 location 命中后 nginx 仍会继续试正则 location，正则一旦命中就由正则胜出 ——
#    不加 `^~` 的话 /assets/*.js 会被按扩展名的那条正则抢走，落到 7 天上。

# SPA 回退 + HTML 外壳：每次回源校验
location / {
    try_files $uri $uri/ /index.html;
    expires -1;
}

# Vite 产物：文件名带内容哈希，长缓存
location ^~ /assets/ {
    expires 1y;
    access_log off;
    error_log off;
}

# public/ 下原样拷贝、文件名不带哈希的资源：短缓存
location ^~ /jpgs/     { expires 1h;  access_log off; }
location ^~ /stickers/ { expires 1h;  access_log off; }
location ^~ /icons/    { expires 1h;  access_log off; }
location ^~ /music/    { expires 7d;  access_log off; }

# 其余按扩展名的静态资源。原先是 180d，收到 7 天 —— 能走到这里的多半是
# public/ 下不带哈希的文件，真正的长期缓存交给上面的 /assets/。
location ~* \.(js|css|png|jpg|jpeg|gif|bmp|swf|ico|svg|woff|woff2|ttf|eot|webp|mp3|wav|ogg|m4a|mp4|webm|ogv)$ {
    expires 7d;
    access_log off;
    error_log off;
}

# ⚠️ 还要删掉 aaPanel 默认模板里按扩展名的 expires 规则（例如
#    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; }），
#    否则它们会和本文件叠加，且常常是先命中的那一条。
#
# 当前 vhost 里保留了一条 `location ~ .*\.(js|css)?$ { expires 12h; }`。
# 它的正则是错的（(js|css)? 让整组可选），但因为它排在按扩展名的那条之后，
# 且 /assets/ 已被 ^~ 抢走，实际不生效。留着是为了不改动无关内容。
#
# ── 验证方式 ────────────────────────────────────────────────────────────
#   curl -sI https://v1rtual.top/            | grep -i cache-control   # 期望 no-cache
#   curl -sI https://v1rtual.top/home        | grep -i cache-control   # 期望 no-cache
#   curl -sI https://v1rtual.top/assets/<任一带哈希产物> | grep -i cache-control   # 期望 max-age=31536000
#   curl -sI https://v1rtual.top/jpgs/sky_page.png       | grep -i cache-control   # 期望 max-age=3600
# 同时确认 strict-transport-security 仍在（add_header 覆盖会让它消失）。

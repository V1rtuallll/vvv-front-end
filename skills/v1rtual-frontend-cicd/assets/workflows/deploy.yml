name: Deploy frontend

on:
  # Start this workflow from Actions and select the complete site branch to release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1rtual-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production dist
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REVISION: ${{ github.sha }}
        run: |
          ssh_base=(ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_SSH_PORT")
          rsync -az --delete -e "${ssh_base[*]}" dist/ "$DEPLOY_USER@$DEPLOY_HOST:/tmp/v1rtual-frontend-$REVISION/"
          "${ssh_base[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/v1rtual-deploy-frontend $REVISION"
